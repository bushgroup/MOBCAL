[project]
name = "mobcal"
version = "2.0.0.dev0"
description = "Collision cross sections by the trajectory method: the 2012 MOBCAL Fortran with a Python driver, process fanout, and installers."
readme = "README.md"
requires-python = "==3.12.*"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# cclib reads the quantum-chemistry outputs `mobcal import` takes, and only
# mobcal.io.structure imports it, lazily, so `mobcal run` never loads it or the
# numpy and scipy it brings. Pinned exactly: 1.8.1, the last stable release,
# stops with an IndexError on every ORCA 6.1.1 output in tests/data/qm/, and
# 1.9rc1 reads all six. The window, `mobcal gui`, is PySide6: the Essentials
# wheel alone (QtCore, QtGui, QtWidgets), not the Addons the window never uses,
# and only mobcal.app imports it, so `mobcal run` never loads Qt either.
dependencies = [
    "cclib==1.9rc1",
    "PySide6-Essentials~=6.11.2",
]

[project.scripts]
mobcal = "mobcal.cli:main"

[project.urls]
Repository = "https://github.com/bushgroup/MOBCAL"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobcal"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller~=6.22",
    "pytest~=9.1",
    "pytest-qt~=4.5",
    "ruff~=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Nitrogen is about an hour: `uv run pytest -m nitrogen` for it alone; `-m long` for the long
# helium tests (the two-set split, about seven minutes); `-m ""` for everything.
addopts = ["-m", "not nitrogen and not long and not bound"]
markers = [
    "nitrogen: the nitrogen regression run, about an hour; deselected by default",
    "long: helium tests of several minutes beyond the gate's; deselected by default",
    "bound: an ion at the shipped atom bound, read to the end of the reader; weekly",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
