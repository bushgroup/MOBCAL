[project]
name = "mobcal"
version = "2.0.0.dev0"
description = "Collision cross sections by the trajectory method: the 2012 MOBCAL Fortran with a Python driver, process fanout, and installers."
readme = "README.md"
requires-python = "==3.12.*"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# No runtime dependencies yet. The driver (lab record, task 05) decides whether
# it needs anything beyond the standard library; the window (task 08) brings
# PySide6, and only mobcal.app imports it.
dependencies = []

[project.scripts]
mobcal = "mobcal.cli:main"

[project.urls]
Repository = "https://github.com/bushgroup/MOBCAL"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobcal"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Nitrogen is about an hour: `uv run pytest -m nitrogen` for it alone, `-m ""` for everything.
addopts = ["-m", "not nitrogen"]
markers = ["nitrogen: the nitrogen regression run, about an hour; deselected by default"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
