name: ci

# Does it build, and does it still compute the 2012 numbers: the 2012 Fortran compiled on Linux,
# macOS and Windows with the recipe in mobcal.fortran (this file does not restate the flags), the
# self-check and the tests run, and both binaries kept as artifacts. tools/check_public.py fails
# on any compiler warning. The tests include the helium regression gate, a few minutes, and the
# nitrogen program's one-cycle check, choline as worker 10 of 10 against cycle 10 of the 2012
# reference, a tenth of the nitrogen gate run alongside helium's. The whole nitrogen gate, about
# an hour, runs weekly and on a manual dispatch that asks for it, beside a 200,000-atom ion read
# through the helium program to the end of its reader (tests/test_bound.py).
#
# Then the installable program, from those artifacts: the Windows installer and the macOS and
# Linux archives, each installed or unpacked where no compiler or Python is visible and run
# through its self-check and the 2012 choline input in helium, and its window opened and closed
# (`mobcal gui --check`): on Linux in a container with a desktop's X libraries but not
# libxcb-cursor0, which the archive carries. A pushed v* tag also gathers the
# three into a draft GitHub release, which is published by hand.

on:
  # push is limited to main so a branch with an open pull request does not run twice per commit.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"  # Mondays, 09:17 UTC
  workflow_dispatch:
    inputs:
      nitrogen:
        description: Also run the nitrogen regression gate (about an hour per platform)
        type: boolean
        default: false

# Keyed on the event too, so that a push to main does not cancel a scheduled or manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nitrogen) && 180 || 30 }}
    strategy:
      # When one platform fails, what the other two did in the same run is the evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes full versions only; there is no moving major tag to follow.
      - uses: astral-sh/setup-uv@v10.3.0

      # Each branch sets FC, which mobcal.fortran.find_gfortran() honours before PATH. The
      # window's tests run on Qt's offscreen platform, which needs EGL, xkbcommon and fontconfig.
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          echo "FC=$(command -v gfortran)" >> "$GITHUB_ENV"

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          echo "FC=$(brew --prefix gcc)/bin/gfortran" >> "$GITHUB_ENV"

      - name: Install gfortran (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc-fortran

      # MSYS2's gfortran is used from the runner's own shell, as on a workstation: build() puts
      # its directory on the subprocess PATH, and -static keeps the binary off it afterwards.
      - name: Point FC at MSYS2's gfortran (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fc = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin\gfortran.exe'
          "FC=$fc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compiler
        shell: bash
        run: |
          "$FC" --version | head -1
          uv run python -c "from mobcal import fortran; print(fortran.describe())"

      - name: Lock file is current
        run: uv sync --locked

      # The self-check also compares fortran/ against its SHA-256 pins, which a CRLF checkout
      # would fail, so .gitattributes is tested here on every platform.
      - name: Self-check
        run: uv run tools/check_public.py

      # MOBCAL_REQUIRE_GFORTRAN turns the regression gate's no-compiler skip into a failure.
      - name: Tests, with the helium regression gate and one nitrogen cycle
        env:
          MOBCAL_REQUIRE_GFORTRAN: "1"
        run: uv run pytest -ra

      - name: Nitrogen regression gate, and an ion at the atom bound
        if: github.event_name == 'schedule' || inputs.nitrogen
        env:
          MOBCAL_REQUIRE_GFORTRAN: "1"
        run: uv run pytest -ra -m "nitrogen or bound"

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check .

      - name: Build the binaries
        run: uv run mobcal build

      # The two binaries and the build.json that records them, which the package job checks.
      - uses: actions/upload-artifact@v7
        with:
          name: mobcal-${{ runner.os }}-${{ runner.arch }}
          path: build/fortran/
          if-no-files-found: error
          retention-days: 30

      # The window and its About box, light and dark where the platform takes a colour scheme,
      # to see what each native style does with mobcal.app.theme's palette. Linux grabs on Qt's
      # offscreen platform: Fusion, one scheme.
      - name: Screenshots of the window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export QT_QPA_PLATFORM=offscreen; fi
          uv run tools/window_shots.py build/screenshots

      - uses: actions/upload-artifact@v7
        with:
          name: window-${{ runner.os }}
          path: build/screenshots/
          if-no-files-found: error
          retention-days: 30

  package:
    name: package ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Linux on the oldest runner the window supports: the archive carries libxcb-cursor and
      # the C runtime's companions from the machine it is built on, and each asks for that
      # machine's glibc. Qt's wheels need GCC 11's libstdc++ (Ubuntu 22.04) in any case. The
      # Fortran binaries are static and come from the build job.
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Lock file is current
        run: uv sync --locked

      # The binaries this platform's build job compiled and tested, not a new compile.
      - uses: actions/download-artifact@v7
        with:
          name: mobcal-${{ runner.os }}-${{ runner.arch }}
          path: build/fortran/

      # The archive carries libxcb-cursor.so.0 beside Qt's xcb plugin; the spec collects the
      # build machine's copy and refuses to build without one. Offscreen Qt for the window check.
      - name: Libraries for the window (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # build_bundle.py refuses binaries that need a gfortran runtime or do not match their
      # build.json, runs the built program's self-check with PATH cut to the OS's own, and
      # opens and closes its window offscreen.
      - name: Bundle (macOS, Linux)
        if: runner.os != 'Windows'
        run: uv run tools/build_bundle.py --archive

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Bundle and installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build_exe.ps1

      # A clean machine, as near as a runner gets: Linux containers with neither gfortran nor
      # Python, the oldest a glibc-2.28 one; on macOS and Windows, PATH cut to the OS's own.
      - name: Unpacked on a clean Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && tar -xzf dist/mobcal-*.tar.gz -C "$RUNNER_TEMP/clean"
          for img in almalinux:8 ubuntu:20.04; do
            echo "== $img"
            docker run --rm -v "$RUNNER_TEMP/clean:/opt" -w /tmp "$img" sh -c '/opt/mobcal-*/mobcal self-check'
          done
          echo "== debian:stable-slim, with choline"
          docker run --rm -v "$RUNNER_TEMP/clean:/opt" -w /tmp debian:stable-slim sh -c '/opt/mobcal-*/mobcal self-check --choline'
          for img in debian:stable-slim ubuntu:22.04; do
          echo "== $img, the window on X11 (Xvfb), without libxcb-cursor0"
          docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$RUNNER_TEMP/clean:/opt" -w /tmp "$img" sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends xvfb xauth libgl1 libegl1 \
              libfontconfig1 libdbus-1-3 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
              libx11-xcb1 libxcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libxcb-sync1 libxcb-shm0 libxcb-render0 >/dev/null
            if dpkg -s libxcb-cursor0 >/dev/null 2>&1; then echo "libxcb-cursor0 is installed"; exit 1; fi
            QT_QPA_PLATFORM=xcb xvfb-run -a /opt/mobcal-*/mobcal gui --check'
          done

      # The archive holds MOBCAL.app; the command is the console program inside it.
      - name: Unpacked on macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/clean" && tar -xzf dist/mobcal-*.tar.gz -C "$RUNNER_TEMP/clean"
          codesign --verify --deep --strict "$RUNNER_TEMP/clean/MOBCAL.app"
          cd "$RUNNER_TEMP" && env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP"/clean/MOBCAL.app/Contents/MacOS/mobcal self-check --choline
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$RUNNER_TEMP"/clean/MOBCAL.app/Contents/MacOS/mobcal gui --check

      # Per-user and silent, as a person without admin rights would install it; then the
      # installed command, the PATH entry the default task adds, and a clean uninstall.
      - name: Installed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installer\mobcal-*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\MOBCAL'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $app) { throw "$app is not on the user PATH: $userPath" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:MOBCAL_BIN_DIR -ErrorAction SilentlyContinue
          Set-Location $env:RUNNER_TEMP
          & "$app\mobcal.exe" self-check --choline
          if ($LASTEXITCODE -ne 0) { throw "installed self-check exited $LASTEXITCODE" }
          if (-not (Test-Path "$app\mobcal-gui.exe")) { throw "no mobcal-gui.exe" }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\MOBCAL\MOBCAL.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne "$app\mobcal-gui.exe") { throw "the shortcut opens $target" }
          & "$app\mobcal.exe" gui --check
          if ($LASTEXITCODE -ne 0) { throw "the installed window did not open: exit $LASTEXITCODE" }
          # The uninstaller relaunches itself from a temporary copy and returns at once, so the
          # files are waited for rather than the process.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\mobcal.exe") -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\mobcal.exe") { throw "mobcal.exe is still there 60 s after uninstall" }
          Start-Sleep -Seconds 2
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $app) { throw "$app is still on the user PATH" }
          "installed, checked and uninstalled"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/installer/*.exe
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Only for a pushed tag, which only Matt pushes: a draft release holding the three packages,
  # after a check that the tag names the version the packages carry.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release/
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not name the version in pyproject.toml, ${version}"; exit 1
          fi
          # The Windows artifact keeps its installer/ folder: take the files, wherever they sit.
          mapfile -t packages < <(find release -type f | sort)
          ls -l "${packages[@]}"
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "expected three packages, found ${#packages[@]}"; exit 1
          fi
          pre=$(python3 -c "import re, sys; print('--prerelease' if re.search(r'(a|b|rc|dev)[0-9]+', sys.argv[1]) else '')" "$version")
          gh release create "${GITHUB_REF_NAME}" "${packages[@]}" --draft $pre \
            --title "MOBCAL ${version}" \
            --notes "Installers for Windows, macOS (Apple silicon) and Linux (x86-64). How to install and check them: docs/install.md."
