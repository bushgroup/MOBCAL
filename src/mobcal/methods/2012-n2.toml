# MOBCAL 2012 (N2): the calculation of the 2012 release in nitrogen, its element table and
# run settings with RANLUX, the 2012 generator, which reproduces the 2012 outputs at the 2012
# seed. inum and inor set the helium program's projection and hard-sphere pass, which the
# nitrogen program does not make. docs/methods.md describes the format.

format = 1
name = "MOBCAL 2012 (N2)"
gas = "n2"
parameters = "2012"
generator = "ranlux"
temperature = 301
imp = 1000
itn = 10
inp = 40
inum = 250000
inor = 30
